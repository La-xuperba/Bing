name: BINANCE GEMS

on:
  schedule:
    # GitHub may delay or skip scheduled runs under load; 5 minutes is the minimum interval.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_signal_scan:
        description: 'Run the early-pump scan now (ignore the 15-minute interval)'
        type: boolean
        default: false
      dry_run:
        description: 'Detect and print posts only - publish nothing, do not save state'
        type: boolean
        default: false

permissions:
  contents: write   # only used to push state/state.json to the separate "bot-state" branch

concurrency:
  group: binance-gems
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for state branch
        id: statebranch
        run: |
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore state (existing bot-state branch)
        if: steps.statebranch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state_repo

      - name: Initialise state (first run only)
        if: steps.statebranch.outputs.exists != 'true'
        run: |
          mkdir state_repo
          cd state_repo
          git init -q -b bot-state
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BINANCE GEMS
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
          # Reserved for future market-cap features (the original bot has no market-cap logic).
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          BOT_STATE_PATH: state_repo/state.json
          BOT_DRAFT_PATH: square_drafts.txt
          FORCE_SIGNAL_SCAN: ${{ inputs.force_signal_scan }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_SCORE: '45'
          MAX_WORKERS: '8'
          FLASH_THRESHOLD_PCT: '5'
          FLASH_COOLDOWN_MINUTES: '60'
          SIGNAL_COOLDOWN_MINUTES: '120'
          SIGNAL_SCAN_INTERVAL_MINUTES: '15'
          BOT_MAX_RUNTIME_SECONDS: '600'
        run: python crypto_signal_bot.py

      - name: Save state to bot-state branch
        if: always()
        run: |
          cd state_repo
          if [ ! -f state.json ]; then echo "No state file to save."; exit 0; fi
          git config user.name "binance-gems-bot"
          git config user.email "binance-gems-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet && git rev-parse HEAD >/dev/null 2>&1; then
            echo "State unchanged."; exit 0
          fi
          if git rev-parse HEAD >/dev/null 2>&1; then
            git commit -q --amend -m "BINANCE GEMS state"
          else
            git commit -q -m "BINANCE GEMS state"
          fi
          for i in 1 2 3; do
            if git push -q --force origin HEAD:bot-state; then echo "State saved."; exit 0; fi
            echo "push failed (attempt $i), retrying"; sleep 5
          done
          echo "::error::Could not save state"; exit 1

      - name: Upload drafts and ranking CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-gems-${{ github.run_number }}
          path: |
            square_drafts.txt
            pre_pump_ranking_*.csv
          if-no-files-found: ignore
          retention-days: 7
