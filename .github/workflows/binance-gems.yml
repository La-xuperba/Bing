name: BINANCE GEMS Spot Scanner

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes (UTC)
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-gems-spot-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download Binance Square Post Skill
        run: |
          rm -rf /tmp/binance-skills-hub square-skill
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git /tmp/binance-skills-hub
          cp -R /tmp/binance-skills-hub/skills/binance/square-post square-skill
          test -f square-skill/scripts/post-image.mjs
          test -f square-skill/scripts/lib.mjs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore scanner state
        run: |
          if [ ! -f state.json ]; then
            echo '{}' > state.json
          fi

      - name: Check bot
        run: |
          python -m py_compile bot.py
          python bot.py --selftest

      - name: Run BINANCE GEMS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

          MAX_RUNTIME_MIN: "12"
          POLL_SEC: "30"

          STATE_FILE: "state.json"
          CARD_DIR: "cards"
          SQUARE_SKILL_DIR: "square-skill"

          DRY_RUN: "false"
          PYTHONUNBUFFERED: "1"

        run: python bot.py

      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f state.json ]; then
            git add -f state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update scanner state [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "Scanner state saved."
            else
              echo "No state changes."
            fi
          else
            echo "WARNING: state.json not found."
          fi
