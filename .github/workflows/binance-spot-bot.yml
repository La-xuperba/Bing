name: Binance Spot Signal Bot

on:
  schedule:
    # প্রতি 2 মিনিট পর পর চলবে (GitHub Actions-এর মিনিমাম লিমিটের কারণে)
    - cron: '*/5 * * * *'   # প্রতি 5 মিনিট
  workflow_dispatch:        # ম্যানুয়ালিও চালানো যাবে

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Binance Spot Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}
        run: |
          python bot.py
