name: Crypto Signal Bot

on:
  schedule:
    # প্রতি ৬ ঘণ্টায় চলবে (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:   # ম্যানুয়ালিও চালানো যাবে

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MAX_RUNTIME_MIN: "340"
          POLL_SEC: "30"
          DRY_RUN: "0"
        run: python bot.py
